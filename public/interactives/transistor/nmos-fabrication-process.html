<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>NMOS 制造全流程演示</title>
		<style>
			:root {
				color-scheme: light;
				--surface: #ffffff;
				--surface-container: #f5f7fb;
				--surface-container-high: #e7ebf2;
				--surface-container-highest: #cfd6e2;
				--on-surface-default: #202327;
				--on-surface-muted: #687282;
				--on-primary: #ffffff;
				--outline: #d9dee8;
				--outline-variant: #c1c8d5;
				--primary: #2563eb;
				--chart-1: #4f8cff;
				--chart-2: #00a88f;
				--chart-3: #ffd166;
				--negative: #d73a49;
				--positive: #168a5a;
				--shadow: rgba(32, 35, 39, 0.1);
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					"Microsoft YaHei", sans-serif;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					color-scheme: dark;
					--surface: #181b1f;
					--surface-container: #101418;
					--surface-container-high: #20252c;
					--surface-container-highest: #333b47;
					--on-surface-default: #e8eaed;
					--on-surface-muted: #a8b0bb;
					--on-primary: #07111f;
					--outline: #3a4452;
					--outline-variant: #566171;
					--primary: #7aa7ff;
					--chart-1: #75a7ff;
					--chart-2: #28c6ad;
					--chart-3: #d7a63a;
					--negative: #ff6b78;
					--positive: #46d39a;
					--shadow: rgba(0, 0, 0, 0.28);
				}
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: var(--surface-container);
				color: var(--on-surface-default);
			}

			body {
				display: flex;
				flex-direction: column;
			}

			button,
			input {
				font: inherit;
			}

			.widget-header {
				flex: 0 0 auto;
				padding: 14px 16px 10px;
				border-bottom: 1px solid var(--outline);
				background: var(--surface);
				box-shadow: 0 1px 8px var(--shadow);
			}

			.header-top {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 14px;
			}

			.widget-title {
				min-width: 180px;
				margin: 0;
				color: var(--on-surface-default);
				font-size: 16px;
				font-weight: 650;
				line-height: 24px;
				letter-spacing: 0;
			}

			.widget-dashboard {
				display: grid;
				grid-template-columns: minmax(190px, 1fr) minmax(100px, 0.44fr);
				gap: 8px;
				width: min(100%, 620px);
			}

			.dash-pill {
				min-width: 0;
				padding: 8px 10px;
				border: 1px solid var(--outline);
				border-radius: 8px;
				background: var(--surface-container);
			}

			.dash-label {
				display: block;
				margin-bottom: 2px;
				color: var(--on-surface-muted);
				font-size: 11px;
				font-weight: 750;
				line-height: 16px;
				letter-spacing: 1px;
				text-transform: uppercase;
			}

			.dash-value {
				display: block;
				overflow: hidden;
				color: var(--on-surface-default);
				font-family:
					"SF Mono", "Roboto Mono", "Cascadia Code", ui-monospace, Menlo, monospace;
				font-size: 14px;
				font-weight: 750;
				line-height: 20px;
				letter-spacing: 0;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.header-status {
				margin-top: 8px;
				color: var(--on-surface-muted);
				font-size: 12px;
				font-weight: 650;
				line-height: 18px;
				letter-spacing: 0;
			}

			.viz-container {
				position: relative;
				flex: 1 1 auto;
				min-height: 0;
				background:
					radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.08), transparent 42%),
					var(--surface-container);
				overflow: hidden;
			}

			canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				outline: none;
				touch-action: none;
				cursor: pointer;
			}

			.control-grid {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 118px 96px;
				gap: 10px;
				flex: 0 0 auto;
				width: 100%;
				padding: 12px 16px 14px;
				border-top: 1px solid var(--outline);
				background: var(--surface);
			}

			.control-row {
				display: grid;
				grid-template-columns: 82px minmax(0, 1fr) 74px;
				align-items: center;
				gap: 10px;
				min-width: 0;
			}

			.control-label {
				overflow: hidden;
				color: var(--on-surface-default);
				font-size: 14px;
				font-weight: 520;
				line-height: 20px;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.slider-wrap {
				display: flex;
				min-width: 0;
			}

			.step-slider {
				width: 100%;
				accent-color: var(--primary);
			}

			.step-number {
				width: 74px;
				min-height: 36px;
				padding: 0 8px;
				border: 1px solid var(--outline);
				border-radius: 8px;
				background: var(--surface-container);
				color: var(--on-surface-default);
				font-family:
					"SF Mono", "Roboto Mono", "Cascadia Code", ui-monospace, Menlo, monospace;
				font-size: 14px;
				font-weight: 750;
				line-height: 20px;
			}

			.action-button {
				width: 100%;
				min-height: 36px;
				border: 1px solid var(--outline);
				border-radius: 8px;
				background: var(--surface-container-high);
				color: var(--on-surface-default);
				font-size: 14px;
				font-weight: 750;
				cursor: pointer;
			}

			.action-button:hover {
				border-color: color-mix(in srgb, var(--primary), var(--outline) 42%);
				color: var(--primary);
			}

			@media (max-width: 760px) {
				.header-top,
				.widget-dashboard,
				.control-grid,
				.control-row {
					grid-template-columns: 1fr;
				}

				.header-top {
					display: grid;
				}

				.widget-dashboard {
					width: 100%;
				}

				.control-grid {
					gap: 12px;
				}

				.control-row {
					gap: 7px;
				}

				.step-number {
					width: 100%;
				}
			}
		</style>
	</head>
	<body>
		<header class="widget-header">
			<div class="header-top">
				<h1 class="widget-title">NMOS 制造全流程演示</h1>
				<div id="widget-dashboard" class="widget-dashboard" aria-live="polite"></div>
			</div>
			<div id="app-status" class="header-status">准备高纯度的 P 型单晶硅作为制造衬底。</div>
		</header>

		<main id="viz" class="viz-container" aria-label="NMOS 制造全流程画布">
			<canvas aria-hidden="true"></canvas>
		</main>

		<footer id="controls-root" class="control-grid">
			<div class="control-row" data-key="step">
				<label class="control-label" for="step-slider">制造步骤</label>
				<div class="slider-wrap">
					<input id="step-slider" class="step-slider" type="range" min="0" max="5" step="1" value="0" />
				</div>
				<input id="step-number" class="step-number" type="number" min="0" max="5" step="1" value="0" />
			</div>
			<button id="reset-button" class="action-button" type="button">重置流程</button>
			<button id="next-button" class="action-button" type="button">下一步</button>
		</footer>

		<script>
			const STEP_LABELS = [
				"准备地基 (P-Substrate)",
				"生长栅氧 (Gate Oxide)",
				"沉积多晶硅 (Poly Deposition)",
				"刻蚀栅极 (Gate Etching)",
				"离子注入 (Self-Aligned Implantation)",
				"金属化与接触 (Metallization)",
			];

			const STEP_DESC = [
				"准备高纯度的 P 型单晶硅作为制造衬底。",
				"在高温下生长一层极薄的二氧化硅作为绝缘栅氧层。",
				"在栅氧层上均匀沉积一层重掺杂的多晶硅作为栅极材料。",
				"通过光刻与刻蚀，只保留中央区域作为栅极结构。",
				"以栅极为掩模，注入五价元素形成自对准的源极 S 和漏极 D。",
				"沉积层间绝缘介质，打孔并填充金属以实现电路连接。",
			];

			const state = {
				step: 0,
				animationProgress: 1,
			};

			const dashboard = document.querySelector("#widget-dashboard");
			const statusEl = document.querySelector("#app-status");
			const viz = document.querySelector("#viz");
			const canvas = document.querySelector("canvas");
			const ctx = canvas.getContext("2d");
			const stepSlider = document.querySelector("#step-slider");
			const stepNumber = document.querySelector("#step-number");
			const resetButton = document.querySelector("#reset-button");
			const nextButton = document.querySelector("#next-button");

			let viewWidth = 1;
			let viewHeight = 1;
			let lastStep = state.step;

			const ui = {
				setHUD(items) {
					dashboard.innerHTML = items
						.map(
							(item) => `
								<div class="dash-pill">
									<span class="dash-label">${escapeHTML(item.label)}</span>
									<span class="dash-value">${escapeHTML(item.value)}</span>
								</div>
							`,
						)
						.join("");
				},
				setStatus(message) {
					statusEl.textContent = message;
				},
			};

			function escapeHTML(value) {
				return String(value)
					.replaceAll("&", "&amp;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
					.replaceAll('"', "&quot;")
					.replaceAll("'", "&#39;");
			}

			function getColor(name) {
				return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
			}

			function transparent(name, alpha) {
				const value = getColor(name);

				if (value.startsWith("#")) {
					const hex = value.slice(1);
					const full = hex.length === 3
						? hex.split("").map((char) => char + char).join("")
						: hex;
					const int = Number.parseInt(full, 16);
					const r = (int >> 16) & 255;
					const g = (int >> 8) & 255;
					const b = int & 255;

					return `rgba(${r}, ${g}, ${b}, ${alpha})`;
				}

				if (value.startsWith("rgb(")) {
					return value.replace("rgb(", "rgba(").replace(")", `, ${alpha})`);
				}

				return value;
			}

			function clampStep(value) {
				return Math.max(0, Math.min(STEP_LABELS.length - 1, Number.parseInt(value, 10) || 0));
			}

			function syncControls() {
				stepSlider.value = String(state.step);
				stepNumber.value = String(state.step);
			}

			function setStep(value) {
				const next = clampStep(value);

				if (next !== state.step) {
					state.step = next;
					state.animationProgress = 0;
				}

				syncControls();
			}

			function resetSim() {
				state.step = 0;
				state.animationProgress = 0;
				syncControls();
				ui.setStatus(STEP_DESC[state.step]);
			}

			function nextStep() {
				if (state.step < STEP_LABELS.length - 1) {
					setStep(state.step + 1);
				} else {
					resetSim();
				}
			}

			function resizeCanvas() {
				const rect = viz.getBoundingClientRect();
				const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

				viewWidth = Math.max(1, rect.width);
				viewHeight = Math.max(1, rect.height);
				canvas.width = Math.floor(viewWidth * dpr);
				canvas.height = Math.floor(viewHeight * dpr);
				canvas.style.width = `${viewWidth}px`;
				canvas.style.height = `${viewHeight}px`;
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			}

			function roundRect(renderCtx, x, y, width, height, radius) {
				const r = Array.isArray(radius) ? Math.max(...radius) : radius;
				const safeR = Math.min(r, width / 2, height / 2);

				renderCtx.beginPath();
				renderCtx.moveTo(x + safeR, y);
				renderCtx.arcTo(x + width, y, x + width, y + height, safeR);
				renderCtx.arcTo(x + width, y + height, x, y + height, safeR);
				renderCtx.arcTo(x, y + height, x, y, safeR);
				renderCtx.arcTo(x, y, x + width, y, safeR);
				renderCtx.closePath();
			}

			function fillRoundRect(x, y, width, height, radius) {
				roundRect(ctx, x, y, width, height, radius);
				ctx.fill();
			}

			function drawTag(text, x, y, colorName = "--on-surface-muted") {
				const paddingX = 8;

				ctx.save();
				ctx.font = "700 12px Inter, system-ui, sans-serif";
				ctx.textBaseline = "middle";
				const width = ctx.measureText(text).width + paddingX * 2;
				const height = 24;
				const left = Math.max(8, Math.min(viewWidth - width - 8, x - width / 2));
				const top = Math.max(8, Math.min(viewHeight - height - 8, y - height / 2));

				ctx.fillStyle = transparent("--surface", 0.92);
				roundRect(ctx, left, top, width, height, 8);
				ctx.fill();
				ctx.strokeStyle = transparent("--outline", 0.92);
				ctx.lineWidth = 1;
				ctx.stroke();
				ctx.fillStyle = getColor(colorName);
				ctx.fillText(text, left + paddingX, top + height / 2);
				ctx.restore();
			}

			function drawArrow(x, y, dx, dy, colorName) {
				const endX = x + dx;
				const endY = y + dy;
				const angle = Math.atan2(dy, dx);
				const head = 8;

				ctx.save();
				ctx.strokeStyle = getColor(colorName);
				ctx.fillStyle = getColor(colorName);
				ctx.lineWidth = 2;
				ctx.beginPath();
				ctx.moveTo(x, y);
				ctx.lineTo(endX, endY);
				ctx.stroke();
				ctx.beginPath();
				ctx.moveTo(endX, endY);
				ctx.lineTo(endX - head * Math.cos(angle - Math.PI / 6), endY - head * Math.sin(angle - Math.PI / 6));
				ctx.lineTo(endX - head * Math.cos(angle + Math.PI / 6), endY - head * Math.sin(angle + Math.PI / 6));
				ctx.closePath();
				ctx.fill();
				ctx.restore();
			}

			function getLayout(width, height) {
				const subW = width * 0.8;
				const subH = Math.max(160, height * 0.4);
				const subX = (width - subW) / 2;
				const subY = height * 0.45;
				const gateW = subW * 0.2;
				const gateH = Math.max(36, Math.min(46, height * 0.075));
				const oxH = 6;

				return { subX, subY, subW, subH, gateW, gateH, oxH };
			}

			function drawScene(time, dt) {
				if (state.step !== lastStep) {
					state.animationProgress = 0;
					lastStep = state.step;
				}

				state.animationProgress = Math.min(1, state.animationProgress + dt * 2);

				const width = viewWidth;
				const height = viewHeight;
				const L = getLayout(width, height);
				const centerX = width / 2;
				const progress = state.animationProgress;

				ctx.fillStyle = getColor("--surface");
				ctx.fillRect(0, 0, width, height);

				ui.setHUD([
					{ label: "当前工序", value: STEP_LABELS[state.step] },
					{ label: "制造进度", value: `${Math.round(((state.step + 1) / 6) * 100)}%` },
				]);
				ui.setStatus(STEP_DESC[state.step]);

				ctx.fillStyle = getColor("--surface-container-highest");
				ctx.fillRect(L.subX, L.subY, L.subW, L.subH);
				ctx.strokeStyle = getColor("--outline-variant");
				ctx.lineWidth = 2;
				ctx.strokeRect(L.subX, L.subY, L.subW, L.subH);

				ctx.fillStyle = getColor("--on-surface-muted");
				ctx.font = "700 20px Inter, system-ui, sans-serif";
				ctx.textAlign = "center";
				ctx.fillText("P-Substrate (P型衬底)", centerX, L.subY + L.subH - 30);

				if (state.step >= 4) {
					const regionW = (L.subW - L.gateW) / 2 - 10;
					const regionH = Math.max(44, Math.min(54, height * 0.08));

					ctx.fillStyle = transparent("--chart-2", 0.4);
					fillRoundRect(L.subX, L.subY, regionW, regionH, 14);
					fillRoundRect(L.subX + L.subW - regionW, L.subY, regionW, regionH, 14);

					ctx.fillStyle = getColor("--chart-2");
					ctx.font = "800 16px Inter, system-ui, sans-serif";
					ctx.fillText("N+", L.subX + regionW / 2, L.subY + 30);
					ctx.fillText("N+", L.subX + L.subW - regionW / 2, L.subY + 30);

					if (state.step === 4) {
						for (let i = 0; i < 20; i++) {
							const bx = L.subX + (L.subW * i) / 19;

							if (bx > centerX - L.gateW / 2 && bx < centerX + L.gateW / 2) continue;
							drawArrow(bx, L.subY - 70 + Math.sin(time * 0.012 + i) * 8, 0, 44, "--chart-2");
						}
					}
				}

				if (state.step >= 1) {
					const isEtched = state.step >= 3;
					const xStart = isEtched ? centerX - L.gateW / 2 : L.subX;
					const targetW = isEtched ? L.gateW : L.subW;
					const animatedW = state.step === 3
						? L.subW - (L.subW - targetW) * progress
						: targetW;
					const animatedX = state.step === 3
						? centerX - animatedW / 2
						: xStart;

					ctx.fillStyle = getColor("--chart-3");
					ctx.fillRect(animatedX, L.subY - L.oxH, animatedW, L.oxH);

					if (state.step >= 2) {
						ctx.fillStyle = getColor("--chart-1");
						ctx.fillRect(animatedX, L.subY - L.oxH - L.gateH, animatedW, L.gateH);

						if (isEtched) {
							ctx.fillStyle = getColor("--on-primary");
							ctx.font = "800 14px Inter, system-ui, sans-serif";
							ctx.fillText("Poly-Si", centerX, L.subY - L.oxH - L.gateH / 2 + 5);
						}
					}
				}

				if (state.step >= 5) {
					ctx.fillStyle = transparent("--surface-container", 0.82);
					const ildY = L.subY - 120;
					const ildH = 120;
					ctx.fillRect(L.subX, ildY, L.subW, ildH);
					ctx.strokeStyle = transparent("--outline", 0.72);
					ctx.strokeRect(L.subX, ildY, L.subW, ildH);

					const contactW = 15;
					const regionW = (L.subW - L.gateW) / 2 - 10;
					const locations = [
						{ x: L.subX + regionW / 2, y: L.subY, label: "Source" },
						{ x: centerX, y: L.subY - L.oxH - L.gateH, label: "Gate" },
						{ x: L.subX + L.subW - regionW / 2, y: L.subY, label: "Drain" },
					];

					locations.forEach((loc) => {
						ctx.fillStyle = getColor("--outline");
						ctx.fillRect(loc.x - contactW / 2, ildY, contactW, loc.y - ildY);
						ctx.fillRect(loc.x - 30, ildY - 5, 60, 5);

						ctx.save();
						ctx.font = "700 12px Inter, system-ui, sans-serif";
						ctx.fillStyle = getColor("--on-surface-default");
						ctx.fillText(loc.label, loc.x, ildY - 15);
						ctx.restore();
					});

					drawTag("Metal", L.subX + 28, ildY + 20, "--outline");
					drawTag("SiO2 (ILD)", L.subX + 112, ildY + 20, "--surface-container-highest");
				}

				if (state.step === 0) drawTag("1. 准备衬底", centerX, L.subY + 50, "--primary");
				if (state.step === 1) drawTag("2. 生长栅氧", centerX, L.subY - 30, "--chart-3");
				if (state.step === 2) drawTag("3. 沉积多晶硅", centerX, L.subY - 82, "--chart-1");
				if (state.step === 3) drawTag("4. 刻蚀栅极结构", centerX, L.subY - 102, "--negative");
				if (state.step === 4) drawTag("5. 离子注入", centerX, L.subY - 124, "--chart-2");
				if (state.step === 5) drawTag("6. 完成制造", centerX, L.subY - 162, "--positive");
			}

			let lastTime = performance.now();
			function frame(time) {
				const dt = Math.min(0.05, Math.max(0, (time - lastTime) / 1000));
				lastTime = time;
				drawScene(time, dt);
				requestAnimationFrame(frame);
			}

			stepSlider.addEventListener("input", (event) => setStep(event.target.value));
			stepNumber.addEventListener("input", (event) => setStep(event.target.value));
			resetButton.addEventListener("click", resetSim);
			nextButton.addEventListener("click", nextStep);
			viz.addEventListener("pointerdown", nextStep);

			new ResizeObserver(resizeCanvas).observe(viz);
			resizeCanvas();
			syncControls();
			requestAnimationFrame(frame);
		</script>
	</body>
</html>
