<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>芯片制造工艺：多晶硅栅极形成</title>
		<style>
			:root {
				color-scheme: light;
				--surface: #ffffff;
				--surface-container: #f5f7fb;
				--surface-container-high: #e7ebf2;
				--surface-container-highest: #cfd6e2;
				--on-surface-default: #202327;
				--on-surface-muted: #687282;
				--outline: #d9dee8;
				--primary: #2563eb;
				--chart-3: #ffd166;
				--chart-4: #00a88f;
				--chart-5: #ef476f;
				--negative: #d73a49;
				--positive: #168a5a;
				--shadow: rgba(32, 35, 39, 0.1);
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					"Microsoft YaHei", sans-serif;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					color-scheme: dark;
					--surface: #181b1f;
					--surface-container: #101418;
					--surface-container-high: #20252c;
					--surface-container-highest: #333b47;
					--on-surface-default: #e8eaed;
					--on-surface-muted: #a8b0bb;
					--outline: #2f3742;
					--primary: #7aa7ff;
					--chart-3: #d7a63a;
					--chart-4: #28c6ad;
					--chart-5: #ff7b9a;
					--negative: #ff6b78;
					--positive: #46d39a;
					--shadow: rgba(0, 0, 0, 0.28);
				}
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: var(--surface-container);
				color: var(--on-surface-default);
			}

			body {
				display: flex;
				flex-direction: column;
			}

			button,
			input {
				font: inherit;
			}

			.widget-header {
				flex: 0 0 auto;
				padding: 14px 16px 10px;
				border-bottom: 1px solid var(--outline);
				background: var(--surface);
				box-shadow: 0 1px 8px var(--shadow);
			}

			.header-top {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 14px;
			}

			.widget-title {
				min-width: 180px;
				margin: 0;
				color: var(--on-surface-default);
				font-size: 16px;
				font-weight: 650;
				line-height: 24px;
				letter-spacing: 0;
			}

			.widget-dashboard {
				display: grid;
				grid-template-columns: minmax(170px, 0.92fr) minmax(150px, 0.72fr);
				gap: 8px;
				width: min(100%, 620px);
			}

			.dash-pill {
				min-width: 0;
				padding: 8px 10px;
				border: 1px solid var(--outline);
				border-radius: 8px;
				background: var(--surface-container);
			}

			.dash-label {
				display: block;
				margin-bottom: 2px;
				color: var(--on-surface-muted);
				font-size: 11px;
				font-weight: 750;
				line-height: 16px;
				letter-spacing: 1px;
				text-transform: uppercase;
			}

			.dash-value {
				display: block;
				overflow: hidden;
				color: var(--on-surface-default);
				font-family:
					"SF Mono", "Roboto Mono", "Cascadia Code", ui-monospace, Menlo, monospace;
				font-size: 14px;
				font-weight: 750;
				line-height: 20px;
				letter-spacing: 0;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.header-status {
				margin-top: 8px;
				color: var(--on-surface-muted);
				font-size: 12px;
				font-weight: 650;
				line-height: 18px;
				letter-spacing: 0;
			}

			.viz-container {
				position: relative;
				flex: 1 1 auto;
				min-height: 0;
				background:
					linear-gradient(180deg, rgba(37, 99, 235, 0.07), transparent 34%),
					var(--surface-container);
				overflow: hidden;
			}

			canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				outline: none;
				touch-action: none;
				cursor: pointer;
			}

			.control-grid {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 116px 96px;
				gap: 10px;
				flex: 0 0 auto;
				width: 100%;
				padding: 12px 16px 14px;
				border-top: 1px solid var(--outline);
				background: var(--surface);
			}

			.control-row {
				display: grid;
				grid-template-columns: 82px minmax(0, 1fr) 74px;
				align-items: center;
				gap: 10px;
				min-width: 0;
			}

			.control-label {
				overflow: hidden;
				color: var(--on-surface-default);
				font-size: 14px;
				font-weight: 520;
				line-height: 20px;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.slider-wrap {
				display: flex;
				min-width: 0;
			}

			.step-slider {
				width: 100%;
				accent-color: var(--primary);
			}

			.step-number {
				width: 74px;
				min-height: 36px;
				padding: 0 8px;
				border: 1px solid var(--outline);
				border-radius: 8px;
				background: var(--surface-container);
				color: var(--on-surface-default);
				font-family:
					"SF Mono", "Roboto Mono", "Cascadia Code", ui-monospace, Menlo, monospace;
				font-size: 14px;
				font-weight: 750;
				line-height: 20px;
			}

			.action-button {
				width: 100%;
				min-height: 36px;
				border: 1px solid var(--outline);
				border-radius: 8px;
				background: var(--surface-container-high);
				color: var(--on-surface-default);
				font-size: 14px;
				font-weight: 750;
				cursor: pointer;
			}

			.action-button:hover {
				border-color: color-mix(in srgb, var(--primary), var(--outline) 42%);
				color: var(--primary);
			}

			@media (max-width: 760px) {
				.header-top,
				.widget-dashboard,
				.control-grid,
				.control-row {
					grid-template-columns: 1fr;
				}

				.header-top {
					display: grid;
				}

				.widget-dashboard {
					width: 100%;
				}

				.control-grid {
					gap: 12px;
				}

				.control-row {
					gap: 7px;
				}

				.step-number {
					width: 100%;
				}
			}
		</style>
	</head>
	<body>
		<header class="widget-header">
			<div class="header-top">
				<h1 class="widget-title">芯片制造工艺：多晶硅栅极形成</h1>
				<div id="widget-dashboard" class="widget-dashboard" aria-live="polite"></div>
			</div>
			<div id="app-status" class="header-status">点击画布或使用按钮推进流程</div>
		</header>

		<main id="viz" class="viz-container" aria-label="多晶硅栅极形成工艺画布">
			<canvas aria-hidden="true"></canvas>
		</main>

		<footer id="controls-root" class="control-grid">
			<div class="control-row" data-key="currentStep">
				<label class="control-label" for="step-slider">当前步骤</label>
				<div class="slider-wrap">
					<input id="step-slider" class="step-slider" type="range" min="1" max="5" step="1" value="1" />
				</div>
				<input id="step-number" class="step-number" type="number" min="1" max="5" step="1" value="1" />
			</div>
			<button id="reset-button" class="action-button" type="button">重置流程</button>
			<button id="next-button" class="action-button" type="button">下一步</button>
		</footer>

		<script>
			const STEP_NAMES = [
				"步骤 1: 准备地基 (Substrate)",
				"步骤 2: 气相沉积 (Deposition)",
				"步骤 3: 光刻显影 (Patterning)",
				"步骤 4: 等离子刻蚀 (Etching)",
				"步骤 5: 去除抗蚀剂 (Stripping)",
			];

			const layers = {
				substrate: { label: "硅衬底 (Si Substrate)", color: "--surface-container-highest" },
				oxide: { label: "二氧化硅 (Gate Oxide)", color: "--chart-3" },
				poly: { label: "多晶硅 (Polysilicon)", color: "--primary" },
				resist: { label: "光刻胶 (Photoresist)", color: "--chart-5" },
				etch: { label: "刻蚀离子束", color: "--chart-4" },
			};

			const state = {
				currentStep: 1,
				anim: 0,
				particles: [],
			};

			const dashboard = document.querySelector("#widget-dashboard");
			const statusEl = document.querySelector("#app-status");
			const viz = document.querySelector("#viz");
			const canvas = document.querySelector("canvas");
			const ctx = canvas.getContext("2d");
			const stepSlider = document.querySelector("#step-slider");
			const stepNumber = document.querySelector("#step-number");
			const resetButton = document.querySelector("#reset-button");
			const nextButton = document.querySelector("#next-button");

			let viewWidth = 1;
			let viewHeight = 1;
			let lastStep = state.currentStep;

			const ui = {
				setHUD(items) {
					dashboard.innerHTML = items
						.map(
							(item) => `
								<div class="dash-pill">
									<span class="dash-label">${escapeHTML(item.label)}</span>
									<span class="dash-value">${escapeHTML(item.value)}</span>
								</div>
							`,
						)
						.join("");
				},
				setStatus(message) {
					statusEl.textContent = message;
				},
			};

			function escapeHTML(value) {
				return String(value)
					.replaceAll("&", "&amp;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
					.replaceAll('"', "&quot;")
					.replaceAll("'", "&#39;");
			}

			function getColor(name) {
				return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
			}

			function transparent(name, alpha) {
				const value = getColor(name);

				if (value.startsWith("#")) {
					const hex = value.slice(1);
					const full = hex.length === 3
						? hex.split("").map((char) => char + char).join("")
						: hex;
					const int = Number.parseInt(full, 16);
					const r = (int >> 16) & 255;
					const g = (int >> 8) & 255;
					const b = int & 255;

					return `rgba(${r}, ${g}, ${b}, ${alpha})`;
				}

				if (value.startsWith("rgb(")) {
					return value.replace("rgb(", "rgba(").replace(")", `, ${alpha})`);
				}

				return value;
			}

			function clampStep(value) {
				return Math.max(1, Math.min(STEP_NAMES.length, Number.parseInt(value, 10) || 1));
			}

			function syncControls() {
				stepSlider.value = String(state.currentStep);
				stepNumber.value = String(state.currentStep);
			}

			function setStep(value) {
				const next = clampStep(value);

				if (next !== state.currentStep) {
					state.currentStep = next;
					state.anim = 0;
					state.particles = [];
				}

				syncControls();
			}

			function resetSim() {
				state.currentStep = 1;
				state.anim = 0;
				state.particles = [];
				syncControls();
				ui.setStatus("流程已重置");
			}

			function nextStep() {
				if (state.currentStep < STEP_NAMES.length) {
					setStep(state.currentStep + 1);
					ui.setStatus("已进入下一步");
				} else {
					resetSim();
				}
			}

			function roundRect(renderCtx, x, y, width, height, radius) {
				const r = Math.min(radius, width / 2, height / 2);
				renderCtx.beginPath();
				renderCtx.moveTo(x + r, y);
				renderCtx.arcTo(x + width, y, x + width, y + height, r);
				renderCtx.arcTo(x + width, y + height, x, y + height, r);
				renderCtx.arcTo(x, y + height, x, y, r);
				renderCtx.arcTo(x, y, x + width, y, r);
				renderCtx.closePath();
			}

			function drawTag(text, x, y, colorName = "--on-surface-muted") {
				const paddingX = 8;
				const widthLimit = viewWidth;
				const heightLimit = viewHeight;

				ctx.save();
				ctx.font = "700 12px Inter, system-ui, sans-serif";
				ctx.textBaseline = "middle";
				const textWidth = ctx.measureText(text).width;
				const width = textWidth + paddingX * 2;
				const height = 24;
				const left = Math.max(8, Math.min(widthLimit - width - 8, x - width / 2));
				const top = Math.max(8, Math.min(heightLimit - height - 8, y - height / 2));

				ctx.fillStyle = transparent("--surface", 0.92);
				roundRect(ctx, left, top, width, height, 8);
				ctx.fill();
				ctx.strokeStyle = transparent("--outline", 0.92);
				ctx.lineWidth = 1;
				ctx.stroke();
				ctx.fillStyle = getColor(colorName);
				ctx.fillText(text, left + paddingX, top + height / 2);
				ctx.restore();
			}

			function resizeCanvas() {
				const rect = viz.getBoundingClientRect();
				const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

				viewWidth = Math.max(1, rect.width);
				viewHeight = Math.max(1, rect.height);
				canvas.width = Math.floor(viewWidth * dpr);
				canvas.height = Math.floor(viewHeight * dpr);
				canvas.style.width = `${viewWidth}px`;
				canvas.style.height = `${viewHeight}px`;
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			}

			function createParticles(width) {
				state.particles = Array.from({ length: 30 }, () => ({
					x: Math.random() * width,
					y: -Math.random() * 120,
					speed: 220 + Math.random() * 280,
				}));
			}

			function drawStepLabel(step, centerX) {
				ctx.save();
				ctx.fillStyle = getColor("--on-surface-default");
				ctx.font = "800 18px Inter, system-ui, sans-serif";
				ctx.textAlign = "center";
				ctx.fillText(STEP_NAMES[step - 1], centerX, 42);
				ctx.restore();
			}

			function drawCompletion(centerX) {
				ctx.save();
				ctx.fillStyle = getColor("--positive");
				ctx.font = "800 20px Inter, system-ui, sans-serif";
				ctx.textAlign = "center";
				ctx.fillText("多晶硅栅极制造完成", centerX, 82);
				ctx.restore();
			}

			function drawEtchingNotice(centerX) {
				ctx.save();
				ctx.fillStyle = getColor("--negative");
				ctx.font = "800 16px Inter, system-ui, sans-serif";
				ctx.textAlign = "center";
				ctx.fillText("等离子体冲刷中...", centerX, 82);
				ctx.restore();
			}

			function draw(dt) {
				const step = state.currentStep;

				if (step !== lastStep) {
					state.anim = 0;
					state.particles = [];
					lastStep = step;
				}

				state.anim += (1 - state.anim) * Math.min(1, dt * 7.5);

				const width = viewWidth;
				const height = viewHeight;
				const centerX = width / 2;
				const centerY = height * 0.6;
				const baseWidth = width * 0.8;
				const baseLeft = centerX - baseWidth / 2;
				const substrateHeight = Math.max(86, height - centerY - 42);
				const polyHeight = Math.max(42, Math.min(60, height * 0.11));
				const prWidth = baseWidth * 0.3;
				const prHeight = Math.max(36, Math.min(50, height * 0.09));
				const oxideHeight = 6;
				const polyTop = centerY - oxideHeight - polyHeight;
				const resistTop = polyTop - prHeight;

				ctx.clearRect(0, 0, width, height);

				drawStepLabel(step, centerX);

				ctx.fillStyle = getColor(layers.substrate.color);
				ctx.fillRect(baseLeft, centerY, baseWidth, substrateHeight);
				ctx.strokeStyle = getColor("--outline");
				ctx.lineWidth = 2;
				ctx.strokeRect(baseLeft, centerY, baseWidth, substrateHeight);
				drawTag(layers.substrate.label, centerX, height - 60);

				ctx.fillStyle = getColor(layers.oxide.color);
				ctx.fillRect(baseLeft, centerY - oxideHeight, baseWidth, oxideHeight);
				drawTag(layers.oxide.label, centerX - baseWidth / 3, centerY - 20, layers.oxide.color);

				if (step >= 2) {
					ctx.fillStyle = getColor(layers.poly.color);

					if (step <= 3) {
						ctx.fillRect(baseLeft, polyTop, baseWidth, polyHeight);
					} else {
						ctx.fillRect(centerX - prWidth / 2, polyTop, prWidth, polyHeight);

						if (step === 4) {
							ctx.save();
							ctx.globalAlpha = Math.max(0, 1 - state.anim);
							ctx.fillRect(baseLeft, polyTop, (baseWidth - prWidth) / 2, polyHeight);
							ctx.fillRect(centerX + prWidth / 2, polyTop, (baseWidth - prWidth) / 2, polyHeight);
							ctx.restore();
						}
					}

					drawTag(layers.poly.label, centerX + baseWidth / 3, polyTop + polyHeight / 2, layers.poly.color);
				}

				if (step === 3 || step === 4) {
					ctx.fillStyle = getColor(layers.resist.color);
					ctx.save();
					ctx.globalAlpha = step === 4 ? 1 : state.anim;
					ctx.fillRect(centerX - prWidth / 2, resistTop, prWidth, prHeight);
					ctx.restore();
					drawTag(layers.resist.label, centerX, resistTop - 20, layers.resist.color);
				}

				if (step === 4) {
					if (state.particles.length === 0) createParticles(width);

					ctx.strokeStyle = getColor(layers.etch.color);
					ctx.lineWidth = 2;
					state.particles.forEach((particle) => {
						ctx.beginPath();
						ctx.moveTo(particle.x, particle.y);
						ctx.lineTo(particle.x, particle.y + 20);
						ctx.stroke();

						particle.y += particle.speed * dt;
						if (particle.y > polyTop) {
							particle.y = -20;
							particle.x = Math.random() * width;
						}
					});
					drawEtchingNotice(centerX);
				}

				if (step === 5) {
					drawCompletion(centerX);
				}

				ui.setHUD([
					{ label: "当前工序", value: STEP_NAMES[step - 1] },
					{ label: "层级状态", value: step >= 2 ? "多层叠加" : "基础层" },
				]);
			}

			let lastTime = performance.now();
			function frame(time) {
				const dt = Math.min(0.05, Math.max(0, (time - lastTime) / 1000));
				lastTime = time;
				draw(dt);
				requestAnimationFrame(frame);
			}

			stepSlider.addEventListener("input", (event) => setStep(event.target.value));
			stepNumber.addEventListener("input", (event) => setStep(event.target.value));
			resetButton.addEventListener("click", resetSim);
			nextButton.addEventListener("click", nextStep);
			viz.addEventListener("pointerdown", nextStep);

			new ResizeObserver(resizeCanvas).observe(viz);
			resizeCanvas();
			syncControls();
			ui.setStatus("点击画布或使用按钮推进流程");
			requestAnimationFrame(frame);
		</script>
	</body>
</html>
